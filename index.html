const LOVE_MSGS = [
  "Seni çok seviyorum kuzum ❤️",
  "Hayatımın anlamı sensin 💕",
  "Seninle her an güzel aşkım 🌹",
  "Dünyalar güzeli Feyzam 💖",
  "Beraber olduğumuz her gün bayram 🎉",
  "Sen benim her şeyimsin 💗",
  "Sonsuz sevgimle, Deniz 💝",
  "Feyza & Deniz, sonsuza dek ♾️❤️",
  "Gözlerin benim güneşim ☀️",
  "Seninle olmak dünyanın en güzel şeyi 🌍💕"
];

const TILES_DATA = [
  { emoji: "🌸", name: "Kiraz" },
  { emoji: "🌙", name: "Ay" },
  { emoji: "⭐", name: "Yıldız" },
  { emoji: "🌻", name: "Ayçiçek" },
  { emoji: "🦋", name: "Kelebek" },
  { emoji: "🌈", name: "Gökkuşağı" },
];

function makeDeck() {
  const pairs = TILES_DATA.map((t, i) => [
    { id: i * 2, pairId: i, ...t },
    { id: i * 2 + 1, pairId: i, ...t },
  ]).flat();
  for (let i = pairs.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pairs[i], pairs[j]] = [pairs[j], pairs[i]];
  }
  return pairs;
}

function SurpriseGame() {
  const [phase, setPhase] = useState("welcome");
  const [deck, setDeck] = useState(() => makeDeck());
  const [flipped, setFlipped] = useState([]);
  const [matched, setMatched] = useState([]);
  const [moves, setMoves] = useState(0);
  const [photoIdx, setPhotoIdx] = useState(0);
  const [msgIdx, setMsgIdx] = useState(0);
  const [showText, setShowText] = useState(false);
  const [showBtn, setShowBtn] = useState(false);
  const [hearts, setHearts] = useState([]);
  const timerRef = useRef(null);
  const slideRef = useRef(null);
  const touchStart = useRef(null);
  const touchEnd = useRef(null);

  const spawnHearts = useCallback(() => {
    const h = [];
    const syms = ["❤️","💕","💖","💗","💝","✨"];
    for (let i = 0; i < 30; i++) {
      h.push({
        left: Math.random() * 100 + "%",
        size: Math.random() * 22 + 12,
        dur: Math.random() * 4 + 3,
        delay: Math.random() * 3,
        symbol: syms[Math.floor(Math.random()*6)],
      });
    }
    setHearts(h);
  }, []);

  

  useEffect(() => {
    if (phase === "slideshow") {
      slideRef.current = setInterval(() => {
        setPhotoIdx(p => {
          const next = p + 1;
          if (next >= PHOTOS.length) {
            setTimeout(() => setPhase("video"), 100);
            return p;
          }
          return next;
        });
        setMsgIdx(m => (m + 1) % LOVE_MSGS.length);
      }, 3500);
      return () => clearInterval(slideRef.current);
    }
  }, [phase]);

  const resetAutoSlide = () => {
    if (slideRef.current) clearInterval(slideRef.current);
    slideRef.current = setInterval(() => {
      setPhotoIdx(p => (p + 1) % PHOTOS.length);
      setMsgIdx(m => (m + 1) % LOVE_MSGS.length);
    }, 3500);
  };

  const goNext = () => {
    setPhotoIdx(p => (p + 1) % PHOTOS.length);
    setMsgIdx(m => (m + 1) % LOVE_MSGS.length);
    resetAutoSlide();
  };

  const goPrev = () => {
    setPhotoIdx(p => (p - 1 + PHOTOS.length) % PHOTOS.length);
    setMsgIdx(m => (m - 1 + LOVE_MSGS.length) % LOVE_MSGS.length);
    resetAutoSlide();
  };

  const onTouchStart = (e) => {
    touchEnd.current = null;
    touchStart.current = e.targetTouches[0].clientX;
  };

  const onTouchMove = (e) => {
    touchEnd.current = e.targetTouches[0].clientX;
  };

  const onTouchEnd = () => {
    if (!touchStart.current || !touchEnd.current) return;
    const diff = touchStart.current - touchEnd.current;
    if (Math.abs(diff) > 50) {
      if (diff > 0) goNext();
      else goPrev();
    }
    touchStart.current = null;
    touchEnd.current = null;
  };

  const handleFlip = (idx) => {
    if (flipped.length === 2) return;
    if (flipped.includes(idx)) return;
    if (matched.includes(deck[idx].pairId)) return;
    const next = [...flipped, idx];
    setFlipped(next);
    if (next.length === 2) {
      const newMoves = moves + 1;
      setMoves(newMoves);
      if (newMoves >= 5) {
        setTimeout(() => {
          setPhase("surprise");
          spawnHearts();
          setTimeout(() => setShowText(true), 400);
          setTimeout(() => setShowBtn(true), 2000);
        }, 600);
        return;
      }
      if (deck[next[0]].pairId === deck[next[1]].pairId) {
        setMatched(prev => [...prev, deck[next[0]].pairId]);
        setFlipped([]);
      } else {
        setTimeout(() => setFlipped([]), 700);
      }
    }
  };

  const isFlipped = (idx) => flipped.includes(idx) || matched.includes(deck[idx].pairId);

  return (
    <div style={{
      minHeight: "100vh",
      background: phase === "welcome" || phase === "game"
        ? "linear-gradient(160deg, #0f0c29 0%, #302b63 50%, #24243e 100%)"
        : "linear-gradient(160deg, #2d1b4e 0%, #8b2252 40%, #c0392b 70%, #e74c3c 100%)",
      display: "flex", alignItems: "center", justifyContent: "center",
      fontFamily: "'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif",
      overflow: "hidden", position: "relative",
      transition: "background 1.5s ease",
      padding: "20px 0",
    }}>
      <style>{`
        @keyframes floatUp {
          0% { transform: translateY(100vh) scale(0); opacity: 0; }
          10% { opacity: 1; transform: translateY(80vh) scale(1); }
          90% { opacity: 0.7; }
          100% { transform: translateY(-20vh) scale(0.5); opacity: 0; }
        }
        @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.06)} }
        @keyframes fadeSlideUp {
          from { opacity:0; transform:translateY(30px); }
          to { opacity:1; transform:translateY(0); }
        }
        @keyframes shimmer {
          0% { background-position: -200% center; }
          100% { background-position: 200% center; }
        }
        @keyframes bounceIn {
          0% { transform: scale(0); opacity:0; }
          50% { transform: scale(1.15); }
          100% { transform: scale(1); opacity:1; }
        }
        .card-grid { display: grid; grid-template-columns: repeat(4,1fr); gap: 10px; }
        .card-cell {
          aspect-ratio: 1;
          perspective: 600px;
          cursor: pointer;
        }
        .card-inner {
          width:100%; height:100%;
          position:relative;
          transition: transform 0.5s ease;
          transform-style: preserve-3d;
        }
        .card-inner.flipped { transform: rotateY(180deg); }
        .card-face {
          position:absolute; inset:0;
          backface-visibility: hidden;
          border-radius: 14px;
          display:flex; align-items:center; justify-content:center;
        }
        .card-front {
          background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
          font-size: 24px; color: rgba(255,255,255,0.3);
          border: 2px solid rgba(255,255,255,0.15);
          box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
        .card-back {
          transform: rotateY(180deg);
          background: rgba(255,255,255,0.12);
          border: 2px solid rgba(255,255,255,0.25);
          font-size: 36px;
          box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .card-matched .card-back {
          background: rgba(255,215,0,0.15);
          border-color: rgba(255,215,0,0.4);
          animation: pulse 1.5s infinite;
        }
      `}</style>

      {phase !== "welcome" && phase !== "game" && phase !== "video" && hearts.map((h, i) => (
        <div key={i} style={{
          position:"fixed", left:h.left, bottom:"-10%",
          fontSize: h.size + "px",
          animation: `floatUp ${h.dur}s ease-in-out infinite`,
          animationDelay: h.delay + "s",
          pointerEvents:"none", zIndex:5, opacity:0,
        }}>{h.symbol}</div>
      ))}

      <div style={{
        background: "rgba(255,255,255,0.07)",
        backdropFilter: "blur(16px)",
        borderRadius: 28,
        padding: phase === "game" ? "28px 20px" : "40px 28px",
        maxWidth: 400, width: "92%",
        textAlign: "center",
        boxShadow: "0 24px 80px rgba(0,0,0,0.35)",
        border: "1px solid rgba(255,255,255,0.1)",
        position: "relative", zIndex: 10,
      }}>

        {phase === "welcome" && (
          <div style={{ animation: "fadeSlideUp 0.7s ease" }}>
            <div style={{ fontSize: 56, marginBottom: 12 }}>🎮</div>
            <h1 style={{
              color: "#e8d5f5", fontSize: 28, fontWeight: 700,
              marginBottom: 6, letterSpacing: "0.5px",
            }}>Hafıza Oyunu</h1>
            <p style={{
              color: "rgba(255,255,255,0.55)", fontSize: 15,
              marginBottom: 28, lineHeight: 1.6,
            }}>
              Eşleşen kartları bul!<br/>Hazır mısın? 😊
            </p>
            <button onClick={() => setPhase("game")} style={{
              background: "linear-gradient(135deg, #a18cd1 0%, #fbc2eb 100%)",
              color: "#2d1b4e", border: "none", borderRadius: 50,
              padding: "15px 52px", fontSize: 18, fontWeight: 700,
              cursor: "pointer", boxShadow: "0 6px 25px rgba(161,140,209,0.4)",
              transition: "transform 0.2s, box-shadow 0.2s",
            }}
            onMouseEnter={e => { e.target.style.transform="scale(1.05)"; }}
            onMouseLeave={e => { e.target.style.transform="scale(1)"; }}
            >Başla!</button>
          </div>
        )}

        {phase === "game" && (
          <div style={{ animation: "fadeSlideUp 0.5s ease" }}>
            <div style={{
              display:"flex", justifyContent:"space-between", alignItems:"center",
              marginBottom: 16, padding: "0 4px",
            }}>
              <span style={{ color: "rgba(255,255,255,0.5)", fontSize: 13 }}>
                Hamle: {moves}
              </span>
              <span style={{ color: "rgba(255,255,255,0.5)", fontSize: 13 }}>
                {matched.length} / {TILES_DATA.length}
              </span>
            </div>
            <div className="card-grid">
              {deck.map((card, idx) => (
                <div key={card.id} className="card-cell" onClick={() => handleFlip(idx)}>
                  <div className={
                    "card-inner" +
                    (isFlipped(idx) ? " flipped" : "") +
                    (matched.includes(card.pairId) ? " card-matched" : "")
                  }>
                    <div className="card-face card-front">?</div>
                    <div className="card-face card-back">{card.emoji}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {phase === "surprise" && (
          <div>
            <div style={{
              fontSize: 72, marginBottom: 4,
              animation: "bounceIn 0.8s ease forwards",
              opacity: 0,
            }}>💖</div>

            <div style={{
              opacity: showText ? 1 : 0,
              transform: showText ? "translateY(0)" : "translateY(20px)",
              transition: "all 0.8s ease",
            }}>
              <h1 style={{
                fontSize: 34, fontWeight: 700,
                background: "linear-gradient(90deg, #ff9a9e, #fad0c4, #ffecd2, #ff9a9e)",
                backgroundSize: "300% 100%",
                WebkitBackgroundClip: "text",
                WebkitTextFillColor: "transparent",
                animation: "shimmer 3s linear infinite",
                marginBottom: 8,
              }}>Feyza ❤️ Deniz</h1>

              <p style={{
                color: "#ffd6e0", fontSize: 20, fontWeight: 600,
                marginBottom: 6, lineHeight: 1.5,
              }}>
                Oyun yok, şaka yaptım! 😍
              </p>
              <p style={{
                color: "rgba(255,255,255,0.85)", fontSize: 17,
                marginBottom: 6, lineHeight: 1.6,
              }}>
                Seni çok seviyorum kuzum! 💕
              </p>
              <p style={{
                color: "rgba(255,255,255,0.6)", fontSize: 14,
                marginBottom: 24, fontStyle: "italic", lineHeight: 1.5,
              }}>
                Sen benim dünyamın en güzel insanısın.<br/>
                Her anımızı seviyorum aşkım. 🌹
              </p>
            </div>

            {showBtn && (
              <button onClick={() => setPhase("slideshow")} style={{
                background: "linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)",
                color: "white", border: "none", borderRadius: 50,
                padding: "14px 36px", fontSize: 17, fontWeight: 700,
                cursor: "pointer",
                boxShadow: "0 6px 25px rgba(255,117,140,0.45)",
                animation: "bounceIn 0.6s ease forwards, pulse 2.5s infinite 0.6s",
                opacity: 0,
              }}>Anılarımıza Bak 📸</button>
            )}
          </div>
        )}

        {phase === "slideshow" && (
          <div style={{ animation: "fadeSlideUp 0.6s ease" }}>
            <h2 style={{
              fontSize: 26, fontWeight: 700,
              background: "linear-gradient(90deg, #ff9a9e, #fad0c4, #ffecd2, #ff9a9e)",
              backgroundSize: "300% 100%",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              animation: "shimmer 3s linear infinite",
              marginBottom: 16,
            }}>Feyza ❤️ Deniz</h2>

            <div
              onTouchStart={onTouchStart}
              onTouchMove={onTouchMove}
              onTouchEnd={onTouchEnd}
              style={{
              width: "100%", aspectRatio: "1",
              borderRadius: 20, overflow: "hidden",
              marginBottom: 16, position: "relative",
              boxShadow: "0 10px 40px rgba(0,0,0,0.4)",
              border: "3px solid rgba(255,255,255,0.15)",
              cursor: "grab",
            }}>
              {PHOTOS.map((src, i) => (
                <img key={i} src={src} alt="" draggable={false} style={{
                  position:"absolute", inset:0,
                  width:"100%", height:"100%",
                  objectFit:"cover",
                  opacity: i === photoIdx ? 1 : 0,
                  transition: "opacity 0.6s ease",
                  userSelect: "none",
                }} />
              ))}
              <div onClick={goPrev} style={{
                position:"absolute", left:0, top:0, bottom:0, width:"20%",
                display:"flex", alignItems:"center", justifyContent:"center",
                background:"linear-gradient(90deg, rgba(0,0,0,0.3), transparent)",
                opacity: 0.6, cursor:"pointer", transition:"opacity 0.2s",
                zIndex: 2,
              }}
              onMouseEnter={e => e.currentTarget.style.opacity="1"}
              onMouseLeave={e => e.currentTarget.style.opacity="0.6"}
              ><span style={{color:"white",fontSize:28,fontWeight:700, textShadow:"0 2px 8px rgba(0,0,0,0.5)"}}>‹</span></div>
              <div onClick={goNext} style={{
                position:"absolute", right:0, top:0, bottom:0, width:"20%",
                display:"flex", alignItems:"center", justifyContent:"center",
                background:"linear-gradient(-90deg, rgba(0,0,0,0.3), transparent)",
                opacity: 0.6, cursor:"pointer", transition:"opacity 0.2s",
                zIndex: 2,
              }}
              onMouseEnter={e => e.currentTarget.style.opacity="1"}
              onMouseLeave={e => e.currentTarget.style.opacity="0.6"}
              ><span style={{color:"white",fontSize:28,fontWeight:700, textShadow:"0 2px 8px rgba(0,0,0,0.5)"}}>›</span></div>
              <div style={{
                position:"absolute", bottom:10, left:"50%", transform:"translateX(-50%)",
                color:"rgba(255,255,255,0.7)", fontSize:12, zIndex:2,
                background:"rgba(0,0,0,0.35)", borderRadius:12, padding:"3px 10px",
              }}>{photoIdx + 1} / {PHOTOS.length}</div>
            </div>

            <p key={msgIdx} style={{
              color: "white", fontSize: 17,
              fontWeight: 600, fontStyle: "italic",
              minHeight: 48,
              animation: "fadeSlideUp 0.6s ease",
            }}>{LOVE_MSGS[msgIdx]}</p>

            <div style={{
              display:"flex", justifyContent:"center", gap: 7, marginTop: 14,
            }}>
              {PHOTOS.map((_, i) => (
                <div key={i} onClick={() => { setPhotoIdx(i); setMsgIdx(i); resetAutoSlide(); }}
                  style={{
                    width: 9, height: 9, borderRadius: "50%",
                    background: i === photoIdx
                      ? "linear-gradient(135deg, #ff758c, #ff7eb3)"
                      : "rgba(255,255,255,0.25)",
                    cursor: "pointer",
                    transition: "all 0.3s",
                    transform: i === photoIdx ? "scale(1.3)" : "scale(1)",
                  }}
                />
              ))}
            </div>
            <button onClick={() => setPhase("video")} style={{
              marginTop: 18,
              background: "linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%)",
              color: "white", border: "none", borderRadius: 50,
              padding: "12px 28px", fontSize: 15, fontWeight: 700,
              cursor: "pointer",
              boxShadow: "0 6px 20px rgba(255,117,140,0.4)",
              animation: "pulse 2.5s infinite",
            }}>Bız ❤️</button>
          </div>
        )}

        {phase === "video" && (
          <div style={{ animation: "fadeSlideUp 0.8s ease" }}>
            <h2 style={{
              fontSize: 24, fontWeight: 700,
              background: "linear-gradient(90deg, #ff9a9e, #fad0c4, #ffecd2, #ff9a9e)",
              backgroundSize: "300% 100%",
              WebkitBackgroundClip: "text",
              WebkitTextFillColor: "transparent",
              animation: "shimmer 3s linear infinite",
              marginBottom: 8,
            }}>Eşşekle Kuzu 🐑🫏</h2>
            <p style={{
              color: "rgba(255,255,255,0.75)",
              fontSize: 14, marginBottom: 18, fontStyle: "italic",
            }}>Bız ❤️ Sadece bız</p>
            <div style={{
              width: "100%",
              aspectRatio: "16/9",
              borderRadius: 18,
              overflow: "hidden",
              boxShadow: "0 12px 40px rgba(0,0,0,0.5)",
              border: "3px solid rgba(255,255,255,0.25)",
              background: "#000",
              position: "relative",
            }}>
              <iframe
                width="100%"
                height="100%"
                src="https://www.youtube.com/embed/yUuYOvmU8VI?si=SA-m9TMJi_KGND-O"
                title="Bız"
                frameBorder="0"
                allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
                referrerPolicy="strict-origin-when-cross-origin"
                allowFullScreen
                style={{ width: "100%", height: "100%", border: "none", display: "block" }}
              />
            </div>
            <a href="https://youtu.be/yUuYOvmU8VI" target="_blank" rel="noopener noreferrer" style={{
              display: "inline-block",
              marginTop: 10,
              color: "rgba(255,255,255,0.55)",
              fontSize: 12,
              textDecoration: "underline",
            }}>Açılmazsa YouTube\'da aç ↗</a>
            <p style={{
              color: "white",
              fontSize: 17,
              fontWeight: 600,
              marginTop: 16,
            }}>Seni seviyorum Feyzam ❤️</p>
            <p style={{
              color: "rgba(255,255,255,0.55)",
              fontSize: 13,
              marginTop: 6,
            }}>— Deniz</p>
          </div>
        )}
      </div>
    </div>
  );
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<SurpriseGame />);
</script>
</body>
</html>
